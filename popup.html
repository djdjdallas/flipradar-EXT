<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlipChecker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- SECTION 1: Header -->
  <header class="header">
    <span class="header-logo">FlipChecker</span>
    <span class="status-badge inactive" id="status-badge">&#9675; INACTIVE</span>
  </header>

  <!-- SECTION 2: Item Detected State -->
  <section class="item-detected" id="item-detected">
    <div class="item-detected-label">Item Detected</div>
    <div class="item-name" id="item-name">—</div>
    <hr class="item-divider">

    <div class="price-grid" id="price-grid">
      <!-- Left column: eBay sold avg -->
      <div class="price-col" id="ebay-col">
        <div class="price-col-label ebay">EBAY SOLD AVG</div>
        <div class="price-col-value ebay" id="ebay-avg">—</div>
        <div class="price-col-sub demand" id="demand-indicator"></div>
      </div>
      <!-- Right column: Est. profit (shown only when calculable) -->
      <div class="price-col" id="profit-col" style="display:none;">
        <div class="price-col-label profit">EST. PROFIT</div>
        <div class="price-col-value profit" id="est-profit">—</div>
        <div class="price-col-sub fees">after fees</div>
      </div>
    </div>

    <div class="price-meta">
      <span class="price-meta-text" id="listed-price"></span>
      <span class="price-meta-text" id="sold-count"></span>
    </div>
  </section>

  <!-- SECTION 3: CTA Buttons -->
  <section class="cta-section" id="cta-section">
    <button class="btn-primary" id="btn-view-ebay">VIEW EBAY SOLD LISTINGS</button>
    <button class="btn-secondary" id="btn-save-deal">SAVE DEAL</button>
  </section>

  <!-- SECTION 4: Empty State -->
  <section class="empty-state" id="empty-state">
    <div class="empty-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
        <path d="M11 8v6"/>
        <path d="M8 11h6"/>
      </svg>
    </div>
    <div class="empty-headline">Navigate to a Listing</div>
    <div class="empty-sub">Go to any Facebook Marketplace item to see eBay comps instantly.</div>
  </section>

  <!-- SECTION 5: Footer -->
  <footer class="footer">
    <button class="footer-link" id="link-deals">MY DEALS</button>
    <button class="footer-link" id="link-settings">SETTINGS</button>
  </footer>

  <script src="dist/popup.js"></script>
</body>
</html>
